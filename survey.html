<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Survey Loader Test</title>
</head>

<body>

<h1>Survey Loader Test</h1>

<div id="result">Loading...</div>

<script>

fetch("survey123.json")
.then(response => response.json())
.then(data => {
    document.getElementById("result").innerHTML =
        "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
})
.catch(error => {
    document.getElementById("result").innerHTML =
        "<h2 style='color:red'>JSON ERROR</h2><pre>"
        + error +
        "</pre>";
});

</script>

</body>
</html>
